version: '3.8'

services:
  schichtplaner:
    container_name: schichtplaner
    image: ghcr.io/donpat1to/schichtenplaner:v1.1.14
    environment:
      - NODE_ENV=${NODE_ENV}
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-please-change}
      - FORCE_HTTPS=${FORCE_HTTPS}
      - TRUST_PROXY_ENABLED=${TRUST_PROXY_ENABLED}
      - TRUSTED_PROXY_IPS=${TRUSTED_PROXY_IPS}
      - APP_PORT=${APP_PORT}
      - APP_URL=http://patitoserver1:${APP_PORT}
    ports:
      - "${APP_PORT}:3002"
    volumes:
      - app_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${APP_PORT}/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  app_data:
